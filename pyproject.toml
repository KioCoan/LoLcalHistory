[project]
name = "lolcal-history"
# Kept in step with lolhist/version.py, which is what the app and the update
# check actually read. The release workflow fails the build if they disagree.
version = "0.1.0"
description = "LoLcal History — a local-only League of Legends match tracker built on the League Client (LCU) API."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
    "flask>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The native window and tray icon. Not required to run the CLI or `serve`, but
# the packaged app is nothing without them — declared so a clean CI machine
# builds the same executable as a development checkout.
desktop = [
    "pywebview>=6",
    "pystray>=0.19",
    "pillow>=10",
]
build = ["pyinstaller>=6.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
