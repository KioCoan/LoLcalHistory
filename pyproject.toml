[project]
name = "lol-local-history"
version = "0.1.0"
description = "Local-only League of Legends match history tracker built on the League Client (LCU) API."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
    "flask>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
