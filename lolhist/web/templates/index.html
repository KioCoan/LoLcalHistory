<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoLcal History</title>
<style>
  /* Dark is the base; `data-theme="light"` swaps the palette. The attribute is
     set from the system preference before the page paints and overridden by a
     saved choice, so there is no `prefers-color-scheme` query anywhere below —
     one light block rather than one per media query. See setTheme(). */
  :root {
    color-scheme: dark;
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --line: #272c37;
    --text: #e6e8ee; --muted: #939bad; --accent: #5b9dd9;
    --win: #46a758; --loss: #d4484b;
    --team-blue: #5b9dd9; --team-red: #e0696d;
    --radius: 0.625rem;

    /* Every length below is in rem and this is the only dial. Widening the
       window enlarges type, icons, padding and the content column together,
       which is what "maximise it" is really asking for. Nothing here asks
       whether the window *is* maximised, so a window merely dragged wide — or
       a browser tab, which has no such state — is treated the same way.

       Two straight lines through two points each: 16px at the window's default
       1280x860, 21px maximised on a 3440x1440 ultrawide. The smaller wins,
       because a window pulled wide but left short has no room for the type its
       width alone would ask for. Clamped at both ends, past which the lines
       stop meaning anything. vw and vh are CSS pixels, so Windows display
       scaling is already folded in. */
    --scale-w: calc(0.2315vw + 13.04px);
    --scale-h: calc(0.862vh + 8.59px);
    font-size: clamp(15px, min(var(--scale-w), var(--scale-h)), 21px);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f5; --line: #e0e3e9;
    --text: #1a1d23; --muted: #666e7d; --accent: #2a6fb0;
    --team-blue: #2a6fb0; --team-red: #b32529;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 0.875rem/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  /* Capped in rem, not pixels, so the column widens with the type instead of
     leaving a narrow page marooned in the middle of a big screen. */
  .wrap { max-width: 100rem; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
  h1 { font-size: 1.25rem; margin: 0; font-weight: 600; }

  /* Every icon is served from a local mirror of the client's own art. When one
     has not been copied yet the <img> is removed and the text stands alone, so
     the layout never depends on the picture arriving. */
  .hdr { display: flex; align-items: center; gap: 0.6875rem; margin-bottom: 1.25rem; }
  /* Pushed to the far end of the header, opposite the account. */
  #theme { margin-left: auto; flex: none; display: inline-flex; align-items: center;
           justify-content: center; width: 2.125rem; height: 2.125rem; padding: 0; cursor: pointer;
           background: var(--panel); color: var(--muted);
           border: 1px solid var(--line); border-radius: 0.5rem; }
  #theme:hover { background: var(--panel-2); color: var(--text); }
  #theme svg { width: 1.0625rem; height: 1.0625rem; display: block; }
  .pfp { width: 2.625rem; height: 2.625rem; border-radius: 50%; flex: none;
         border: 1px solid var(--line); background: var(--panel-2); }
  .champ { width: 1.5rem; height: 1.5rem; border-radius: 0.3125rem; flex: none;
           background: var(--panel-2); }
  .champcell { display: flex; align-items: center; gap: 0.5rem; }
  .build { display: inline-flex; gap: 0.125rem; align-items: center; }
  /* The box is the slot, the image only fills it. An icon that has not been
     mirrored yet removes itself and leaves the empty box, so a five-item build
     never reads as a four-item one. */
  .build .slot { display: inline-block; width: 1.3125rem; height: 1.3125rem; flex: none;
                 border-radius: 0.25rem; background: var(--panel-2); border: 1px solid var(--line); }
  .build .slot img { width: 100%; height: 100%; display: block; border-radius: 0.1875rem; }
  /* The trinket is not part of the build proper; a gap says so. */
  .build .trinket { margin-left: 0.3125rem; }
  /* Fixed width and never collapsed: a player whose spells the client did not
     report still holds the column open, so the builds beside them stay in line. */
  .spells { display: inline-flex; flex-direction: column; gap: 0.125rem; margin-right: 0.3125rem;
            width: 0.9375rem; flex: none; }
  .spells img { width: 0.9375rem; height: 0.9375rem; border-radius: 0.1875rem; }
  .teams li { display: flex; align-items: flex-start; gap: 0.4375rem; }
  .teams .champ { width: 1.375rem; height: 1.375rem; }
  .who { flex: 1 1 auto; min-width: 0; }
  /* The name line stays on one line and truncates; the ladders below it wrap. */
  .who .line { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Every ladder a player is ranked on, side by side. */
  .ranks { display: flex; flex-wrap: wrap; gap: 0.0625rem 0.6875rem; margin-top: 0.0625rem; }
  .rk { white-space: nowrap; font-size: 0.6875rem; }
  .rk em, .rk .pts { font-style: normal; color: var(--muted); }
  /* The ladder this game actually moved. Nothing is marked in a mode that
     moves none, which is most of them. */
  .rk.here em { color: var(--text); font-weight: 600; }
  .norank { color: var(--muted); font-size: 0.6875rem; }

  /* Ladder colours. Spelled out per theme rather than shared: the bright tier
     colours are unreadable on white, and the dark ones vanish on black. Classic
     runs its own ladder with its own bottom tiers (Salt, Wood), so they are
     here too. Anything unrecognised falls through to ordinary text. */
  .r { font-weight: 600; }
  .r-salt        { color: #9fb3c0; }
  .r-wood        { color: #b08155; }
  .r-iron        { color: #9a938e; }
  .r-bronze      { color: #c88b52; }
  .r-silver      { color: #a9b6be; }
  .r-gold        { color: #e0b437; }
  .r-platinum    { color: #4fc0ad; }
  .r-emerald     { color: #45c07a; }
  .r-diamond     { color: #6ba4f5; }
  .r-master      { color: #b473e6; }
  .r-grandmaster { color: #e6696d; }
  .r-challenger  { color: #46cfe6; }
  [data-theme="light"] .r-salt        { color: #506874; }
  [data-theme="light"] .r-wood        { color: #85603a; }
  [data-theme="light"] .r-iron        { color: #6f6763; }
  [data-theme="light"] .r-bronze      { color: #97612f; }
  [data-theme="light"] .r-silver      { color: #5c6a72; }
  [data-theme="light"] .r-gold        { color: #7f6000; }
  [data-theme="light"] .r-platinum    { color: #16786a; }
  [data-theme="light"] .r-emerald     { color: #1b7a44; }
  [data-theme="light"] .r-diamond     { color: #2e63c0; }
  [data-theme="light"] .r-master      { color: #7a35b5; }
  [data-theme="light"] .r-grandmaster { color: #b32529; }
  [data-theme="light"] .r-challenger  { color: #15768a; }

  /* The live tab. Two tables in one panel rather than the two-column list the
     expanded match row uses: there is far more per player here, and a column
     of ranks only reads as a column if it is one. */
  .livehdr { display: flex; align-items: center; gap: 0.625rem; flex-wrap: wrap; padding: 0.75rem 0.75rem 0; }
  .livenote { padding: 0.375rem 0.75rem 0; }
  .liveteam > .side { display: block; padding: 0.875rem 0.75rem 0.25rem; }
  /* The keystone is the thing you read; the secondary tree is context, so it
     sits smaller and dimmer beside it rather than competing. */
  .runes { display: inline-flex; align-items: center; gap: 0.25rem; }
  .runes img.rune { width: 1.375rem; height: 1.375rem; border-radius: 0.25rem; }
  .runes img.runetree { width: 0.9375rem; height: 0.9375rem; opacity: .8; }
  /* Two lines, so the row keeps the height of every other row on the page. */
  .mastery { line-height: 1.35; }
  .mastery .tag { display: block; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); gap: 0.625rem; margin-bottom: 1.25rem; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 0.75rem 0.875rem; }
  .card .k { color: var(--muted); font-size: 0.6875rem; text-transform: uppercase; letter-spacing: .05em; }
  .card .v { font-size: 1.3125rem; font-weight: 600; margin-top: 0.125rem; }

  .bar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 1rem; }
  select { background: var(--panel); color: var(--text); border: 1px solid var(--line);
           border-radius: 0.5rem; padding: 0.4375rem 0.625rem; font: inherit; }
  .tabs { display: flex; gap: 0.25rem; border-bottom: 1px solid var(--line); margin-bottom: 0.875rem; flex-wrap: wrap; }
  .tab { padding: 0.5rem 0.875rem; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent;
         background: none; border-top: 0; border-left: 0; border-right: 0; font: inherit; }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

  .scroll { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
  th, td { padding: 0.5625rem 0.75rem; text-align: left; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 0.6875rem; text-transform: uppercase;
       letter-spacing: .04em; border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; }
  tbody tr { border-top: 1px solid var(--line); }
  tbody tr:hover { background: var(--panel-2); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .w { color: var(--win); font-weight: 600; }
  .l { color: var(--loss); font-weight: 600; }
  .pill { display: inline-block; padding: 0.0625rem 0.4375rem; border-radius: 999px; background: var(--panel-2);
          border: 1px solid var(--line); font-size: 0.6875rem; color: var(--muted); }
  .wrbar { position: relative; height: 0.3125rem; border-radius: 0.1875rem; background: var(--loss); min-width: 3.5rem; }
  .wrbar > i { position: absolute; inset: 0 auto 0 0; border-radius: 0.1875rem; background: var(--win); }
  .expand { cursor: pointer; }
  .detail td { white-space: normal; background: var(--panel-2); }
  .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .teams ul { list-style: none; margin: 0; padding: 0; }
  .teams li { padding: 0.1875rem 0; color: var(--muted); font-size: 0.75rem; }
  .teams li b { color: var(--text); font-weight: 500; }
  /* 100 and 200 are the ids the client uses; blue and red are what the game
     calls them and what anyone reading this actually saw on screen. */
  .teams .side { font-weight: 600; }
  .teams .side.blue { color: var(--team-blue); }
  .teams .side.red  { color: var(--team-red); }
  .augs { margin-top: 0.5rem; }
  .augs .pill { margin: 0 0.25rem 0.25rem 0; color: var(--text); }
  .empty { padding: 1.75rem; text-align: center; color: var(--muted); }
  .alert { border: 1px solid var(--loss); border-left-width: 4px; border-radius: var(--radius);
           background: color-mix(in srgb, var(--loss) 12%, transparent);
           padding: 0.75rem 0.875rem; margin-bottom: 1rem; }
  .alert h3 { margin: 0 0 0.25rem; font-size: 0.875rem; color: var(--loss); }
  .alert p { margin: 0.125rem 0; font-size: 0.78125rem; color: var(--text); }
  .alert code { font-size: 0.75rem; background: var(--panel-2); padding: 0.0625rem 0.3125rem; border-radius: 0.25rem; }
  .ok-note { color: var(--muted); font-size: 0.75rem; margin-bottom: 0.875rem; }
  .foot { margin-top: 1.125rem; color: var(--muted); font-size: 0.75rem; }

  .update { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
            border: 1px solid var(--accent); border-left-width: 4px; border-radius: var(--radius);
            background: color-mix(in srgb, var(--accent) 12%, transparent);
            padding: 0.6875rem 0.875rem; margin-bottom: 1rem; font-size: 0.8125rem; }
  .update b { font-weight: 600; }
  .update .grow { flex: 1 1 auto; }
  .update a { color: var(--accent); }
  .update button { background: var(--accent); color: #fff; border: 0; border-radius: 0.5rem;
                   padding: 0.4375rem 0.875rem; font: inherit; font-weight: 600; cursor: pointer; }
  .update button:hover { filter: brightness(1.08); }
  .update button:disabled { opacity: .6; cursor: default; }
  .update .bar { height: 0.25rem; border-radius: 0.125rem; background: var(--panel-2);
                 width: 100%; overflow: hidden; }
  .update .bar > i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
  .muted { color: var(--muted); font-size: 0.75rem; }
  .tag { color: var(--muted); font-size: 0.6875rem; }
  .lp { color: var(--muted); font-size: 0.6875rem; margin-left: 0.25rem; }

  button#refresh {
    display: inline-flex; align-items: center; gap: 0.4375rem;
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 0.5rem; padding: 0.4375rem 0.75rem; font: inherit; cursor: pointer;
  }
  button#refresh:hover { background: var(--panel-2); }
  button#refresh:disabled { opacity: .6; cursor: default; }
  .spin {
    width: 0.75rem; height: 0.75rem; border-radius: 50%; display: inline-block;
    border: 2px solid var(--line); border-top-color: var(--accent);
  }
  /* Only animate while a refresh is actually running. */
  button#refresh.busy .spin { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    button#refresh.busy .spin { animation: none; border-top-color: var(--text); }
  }
  .updated { color: var(--muted); font-size: 0.75rem; }
</style>
<script>
// Runs before the body renders, so the window never flashes the wrong theme on
// the way to the right one. A saved choice always wins; without one, follow the
// system. localStorage is wrapped because it throws outright in some contexts
// rather than returning null, and a dead theme button beats a dead page.
(function () {
  var saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  var system = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  document.documentElement.dataset.theme =
    (saved === "light" || saved === "dark") ? saved : system;
})();
</script>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <img id="pfp" class="pfp" alt="" hidden>
    <h1 id="who">LoLcal History</h1>
    <button id="theme" type="button"></button>
  </div>

  <div id="update"></div>
  <div id="alert"></div>
  <div class="cards" id="cards"></div>
  <div class="ok-note" id="watcher"></div>

  <div class="bar">
    <!-- Hidden unless this machine has seen more than one account. -->
    <select id="f-account" title="Which account's history to show" hidden></select>
    <select id="f-queue"><option value="">All modes</option></select>
    <select id="f-champ"><option value="">All champions</option></select>
    <select id="f-days">
      <option value="">All time</option>
      <option value="7">Last 7 days</option>
      <option value="30">Last 30 days</option>
      <option value="90">Last 90 days</option>
    </select>
    <button id="refresh" type="button" title="Refresh now (F5)">
      <span class="spin" aria-hidden="true"></span>Refresh
    </button>
    <span class="updated" id="updated"></span>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="scroll"><div id="view"></div></div>
  <div class="foot" id="foot"></div>
</div>

<script>
const TABS = [
  // First, because it is the only tab that goes stale the moment you stop
  // looking. `current` still starts on Matches, so opening the app is unchanged.
  { id: "live",      label: "Live" },
  { id: "matches",   label: "Matches" },
  { id: "champions", label: "Champions" },
  { id: "augments",  label: "Augments" },
  { id: "teammates", label: "Teammates" },
];
let current = "matches";
let sortBy = {};

const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const num = (v, d = 0) => (v === null || v === undefined ? "—" : Number(v).toFixed(d));

// Stroke-only so they take their colour from the button, in either theme.
const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"' +
  ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"' +
  ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/>' +
  '<path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2' +
  'M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

const themeNow = () => document.documentElement.dataset.theme === "light" ? "light" : "dark";

// The icon shows where a click leads, not where you already are — a sun while
// it is dark out. Labelled too, since an icon alone does not say which way.
function paintThemeButton() {
  const next = themeNow() === "light" ? "dark" : "light";
  const button = $("#theme");
  button.innerHTML = next === "dark" ? ICON_MOON : ICON_SUN;
  button.title = `Switch to the ${next} theme`;
  button.setAttribute("aria-label", button.title);
}

// `remember` is false when the system itself changed: following along is not a
// choice, and recording it would freeze the page on whatever it happened to be.
function setTheme(theme, { remember = true } = {}) {
  document.documentElement.dataset.theme = theme;
  if (remember) {
    try { localStorage.setItem("theme", theme); } catch (e) { /* not fatal */ }
  }
  paintThemeButton();
}

function savedTheme() {
  try { return localStorage.getItem("theme"); } catch (e) { return null; }
}

// null means "follow whoever is logged in", which is what the server does when
// no account is sent. Only an explicit pick from the selector overrides that, so
// switching accounts in the client moves the page across on its own.
let accountChoice = null;

function params() {
  const p = new URLSearchParams();
  if (accountChoice) p.set("account", accountChoice);
  const q = $("#f-queue").value, c = $("#f-champ").value, d = $("#f-days").value;
  if (q) p.set("queue", q);
  if (c) p.set("champion", c);
  if (d) p.set("days", d);
  return p.toString();
}
const api = (path) => fetch(`/api/${path}${path.includes("?") ? "&" : "?"}${params()}`).then(r => r.json());

function wrBar(rate) {
  const pct = Math.max(0, Math.min(100, Number(rate) || 0));
  return `<div class="wrbar"><i style="width:${pct}%"></i></div>`;
}
function titleCase(s) {
  return s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : "";
}

// "Emerald II". Classic uses its own tier names (Salt, Wood...) — same shape.
function rankText(p) {
  if (!p || !p.tier) return null;
  const div = p.division && p.division !== "NA" ? " " + p.division : "";
  return titleCase(p.tier) + div;
}

// Ordered low to high. Classic invents its own bottom tiers, so both sets are
// here; this mirrors ranked._TIER_ORDER.
const TIER_ORDER = ["SALT", "WOOD", "IRON", "BRONZE", "SILVER", "GOLD", "PLATINUM",
                    "EMERALD", "DIAMOND", "MASTER", "GRANDMASTER", "CHALLENGER"];
const DIVISION_ORDER = { IV: 0, III: 1, II: 2, I: 3 };
const LADDERS = [["solo", "Solo/Duo"], ["flex", "Flex"], ["classic", "Classic"]];

// One comparable number for a rank, so a column of them sorts by strength.
// Unranked goes below everyone rather than sharing a bucket with Salt IV.
function ladderPosition(tier, division) {
  const index = TIER_ORDER.indexOf(String(tier || "").toUpperCase());
  if (index < 0) return -1;
  return index * 10 + (DIVISION_ORDER[String(division || "").toUpperCase()] || 0);
}

// Tier colours live in CSS classes, not inline styles, so the light and dark
// themes can each pick their own. The guard is because the class name is built
// from a database value.
function tierClass(tier) {
  const t = String(tier || "").toLowerCase();
  return /^[a-z]+$/.test(t) ? `r r-${t}` : "r";
}

// The rank itself, in its ladder's colour. Empty string when unranked, so
// callers can decide what an absent rank should read as.
function rankSpan(p) {
  const text = rankText(p);
  if (!text) return "";
  // An asterisk means the rank is current, not what they held at the time.
  const approx = p.rank_at_match ? "" : "*";
  return `<span class="${tierClass(p.tier)}">${esc(text)}${approx}</span>`;
}

function rankCell(p) {
  const span = rankSpan(p);
  if (!span) return '<span class="muted">Unranked</span>';
  const lp = p && p.league_points != null ? ` ${p.league_points} LP` : "";
  return `${span}<span class="lp">${lp}</span>`;
}

// Every ladder a player is ranked on. Ladders they are unranked on are left
// out — three "Unranked" entries per player would say nothing and crowd out
// the ones that do.
function rankLadders(p) {
  const list = p.ranks || [];
  if (!list.length) return '<span class="norank">Unranked</span>';
  return '<span class="ranks">' + list.map(r => {
    const pts = r.league_points != null ? `<span class="pts"> ${Number(r.league_points)} LP</span>` : "";
    // The initial is all that fits; the tooltip carries the name it stands for.
    const title = esc(r.queue_title) +
      (r.is_game_ladder ? " — the ladder this game counted for" : "");
    return `<span class="rk${r.is_game_ladder ? " here" : ""}" title="${title}">` +
           `<em>${esc(r.queue_label)}</em> ${rankSpan(r)}${pts}</span>`;
  }).join("") + "</span>";
}

// Item and spell names, for the build tooltips. Loaded once — they only move on
// a patch — and empty until then, which just means no tooltip.
let assetNames = { items: {}, spells: {}, perks: {}, perkstyles: {}, jaderunes: {} };

// An icon that removes itself if the mirror has not copied it yet, leaving
// whatever text sits beside it as the only thing the row depends on.
function icon(kind, id, cls, title) {
  if (!id) return "";
  const t = title ? ` title="${esc(title)}"` : "";
  return `<img class="${cls}" src="/icon/${kind}/${Number(id)}" alt=""` +
         `${t} loading="lazy" onerror="this.remove()">`;
}

function championCell(r) {
  const name = esc(r.champion_name || (r.champion_id ? "Champion " + r.champion_id : "?"));
  return `<div class="champcell">${icon("champion", r.champion_id, "champ", r.champion_name)}` +
         `<span>${name}</span></div>`;
}

// Two spells, six item slots, then the trinket — every one of them drawn
// whether or not it is filled, so a build is always exactly as wide as any
// other. Empty slots were already drawn for the six items; the trinket and the
// spells were not, and a build sits at the end of a flex row, so a player
// missing either pulled their whole line out of step with the rest of the team.
// ARAM shows it worst: Poro-Snax fills the trinket for most players and not all.
function buildCell(r) {
  const slot = (id, cls = "slot") =>
    `<span class="${cls}">${id ? icon("item", id, "", assetNames.items[id]) : ""}</span>`;
  const items = [0, 1, 2, 3, 4, 5].map(n => slot(r["item" + n])).join("");
  const trinket = slot(r.item6, "slot trinket");
  const spells = '<span class="spells">' +
    icon("spell", r.spell1_id, "", assetNames.spells[r.spell1_id]) +
    icon("spell", r.spell2_id, "", assetNames.spells[r.spell2_id]) + "</span>";
  return `<div class="build">${spells}${items}${trinket}</div>`;
}

// -- the live tab ----------------------------------------------------------
// Everything below reuses the cells the history tabs already use — champion,
// build, rank ladders, win-rate bar — so a live row and a stored one read the
// same. Only runes and mastery are new, because nothing stored has them.

// This split's ranked record, on the ladder the game is read against.
//
// A rate only appears for your own account, because that is the only one the
// client reports losses for — everyone else comes back with a real win count
// and a flat zero, which would read as a 100% win rate for the whole lobby.
// Their win count is still worth showing; the rate it cannot support is not.
function liveWinRate(r) {
  const w = r.win_rate;
  if (!w) return '<span class="muted">—</span>';
  if (!w.complete) {
    return `<span title="${esc(w.queue_title)} — the client reports wins for other` +
           ` players but never losses, so no win rate can be worked out">` +
           `${w.wins}W <span class="lp">this split</span></span>`;
  }
  return `<span title="${esc(w.queue_title)} — this split">` +
         `${w.wins}W ${w.losses}L <span class="lp">${num(w.rate, 1)}%</span></span>`;
}

// Keystone and secondary tree. All that exists for other players — a full rune
// page is not published by any API — so this is the ceiling, not a first pass.
function runesCell(r) {
  if (r.classic_runes) return classicRunesCell(r);
  const k = r.runes;
  if (!k) return '<span class="muted">—</span>';
  const keystone = k.keystone_name || assetNames.perks[k.keystone_id];
  const tree = k.secondary_style_name || assetNames.perkstyles[k.secondary_style_id];
  const title = [keystone, tree].filter(Boolean).join(" + ");
  return `<span class="runes" title="${esc(title)}">` +
         icon("perk", k.keystone_id, "rune", keystone) +
         icon("perkstyle", k.secondary_style_id, "runetree", tree) + "</span>";
}

// League Classic's page is the old one: nine marks, nine seals, nine glyphs and
// three quintessences. Almost always nine of a kind, so identical runes arrive
// already grouped with a count and only the commonest of each colour is drawn —
// the full page goes in the tooltip.
const CLASSIC_SLOTS = [["marks", "Marks"], ["seals", "Seals"],
                       ["glyphs", "Glyphs"], ["quints", "Quints"]];

function classicRunesCell(r) {
  const page = r.classic_runes;
  const label = (entry) =>
    `${entry.count}× ${entry.name || assetNames.jaderunes[entry.id] || entry.id}`;
  const full = CLASSIC_SLOTS
    .map(([key, name]) => {
      const list = page[key] || [];
      return list.length ? `${name}: ${list.map(label).join(", ")}` : "";
    })
    .filter(Boolean).join("\n");

  const art = CLASSIC_SLOTS.map(([key]) => {
    const top = (page[key] || [])[0];
    if (!top) return "";
    return icon("jaderune", top.id, "rune",
                top.name || assetNames.jaderunes[top.id]);
  }).join("");

  const title = (page.page_name ? `Rune page "${page.page_name}"\n` : "") + full;
  const mast = r.masteries;
  const note = mast
    ? `<span class="tag">${esc(mast.page_name || "Masteries")} · ${mast.points} pts</span>`
    : "";
  return `<div class="mastery"><span class="runes" title="${esc(title)}">${art}</span>${note}</div>`;
}

// Mastery on the champion being played, with their most-played underneath —
// the second is often the better read on a name you do not recognise.
function masteryCell(r) {
  const m = r.mastery;
  const main = m
    ? `<b>${esc(m.level)}</b> <span class="lp">${Number(m.points || 0).toLocaleString()}</span>`
    : '<span class="muted">—</span>';
  const top = (r.top_mastery || [])
    .map(t => `${t.champion_name || t.champion_id} ${Math.round((t.points || 0) / 1000)}k`)
    .join(" · ");
  return `<div class="mastery">${main}` +
         (top ? `<span class="tag" title="highest mastery">${esc(top)}</span>` : "") + "</div>";
}

function lpCell(r) {
  if (r.my_lp_delta === null || r.my_lp_delta === undefined) return "—";
  const v = Number(r.my_lp_delta);
  return `<span class="${v >= 0 ? "w" : "l"}">${v > 0 ? "+" : ""}${v}</span>`;
}

function duration(s) {
  if (!s) return "—";
  const m = Math.floor(s / 60);
  return `${m}:${String(s % 60).padStart(2, "0")}`;
}
function when(ms) {
  if (!ms) return "—";
  const d = new Date(Number(ms));
  return d.toLocaleDateString(undefined, { day: "2-digit", month: "short" }) + " " +
         d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}

function table(cols, rows, opts = {}) {
  if (!rows.length) return `<div class="empty">${opts.empty || "Nothing here yet."}</div>`;
  const key = sortBy[current];
  if (key) {
    const dir = key.desc ? -1 : 1;
    rows = [...rows].sort((a, b) => {
      const x = a[key.col], y = b[key.col];
      if (typeof x === "number" && typeof y === "number") return (x - y) * dir;
      return String(x ?? "").localeCompare(String(y ?? "")) * dir;
    });
  }
  const head = cols.map(c => `<th class="${c.num ? "num" : ""}" data-col="${c.key}">${c.label}</th>`).join("");
  const body = rows.map((r, i) => {
    // Keyed by identity, not position. A new game arriving at the top shifts
    // every index, which would move an expanded row onto a different match.
    const key = opts.key ? opts.key(r) : String(i);
    const cells = cols.map(c => `<td class="${c.num ? "num" : ""}">${c.render ? c.render(r) : esc(r[c.key])}</td>`).join("");
    const extra = opts.detail ? opts.detail(r, key) : "";
    return `<tr class="${opts.detail ? "expand" : ""}" data-key="${esc(key)}">${cells}</tr>${extra}`;
  }).join("");
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

const COLS = {
  live: [
    { key: "champion_name", label: "Champion", render: championCell },
    { key: "name", label: "Player", render: r =>
        esc(r.name) + (r.tagline ? `<span class="tag">#${esc(r.tagline)}</span>` : "") },
    // Sorted on the numeric ladder position, not the tier text, which would put
    // Bronze above Diamond. Rendered by the same helper the Matches tab uses.
    { key: "rank_pos", label: "Rank", render: rankLadders },
    // "Record" rather than "Win rate": a rate is only available for your own
    // account, so a column promising one would be empty for nine players in ten.
    { key: "wr", label: "Record", num: true, render: liveWinRate },
    { key: "wr", label: "", render: r =>
        (r.win_rate && r.win_rate.complete ? wrBar(r.win_rate.rate) : "") },
    { key: "runes", label: "Runes", render: runesCell },
    { key: "mastery_points", label: "Mastery", render: masteryCell },
    { key: "kills", label: "K / D / A", num: true, render: r =>
        r.scores ? `${r.scores.kills}/${r.scores.deaths}/${r.scores.assists}` : "—" },
    { key: "cs", label: "CS", num: true, render: r => (r.scores ? r.scores.cs : "—") },
    { key: "item0", label: "Build", render: buildCell },
  ],
  matches: [
    { key: "game_creation_ms", label: "When", render: r => when(r.game_creation_ms) },
    { key: "queue_name", label: "Mode", render: r => `<span class="pill">${esc(r.queue_name || r.game_mode || "?")}</span>` },
    { key: "champion_name", label: "Champion", render: championCell },
    { key: "win", label: "Result", render: r =>
        r.placement ? `<span class="pill">#${r.placement}</span>`
                    : (r.win ? '<span class="w">Win</span>' : '<span class="l">Loss</span>') },
    { key: "my_rank", label: "Rank", render: r => rankCell(r.my_rank) },
    { key: "my_lp_delta", label: "LP", num: true, render: lpCell },
    { key: "kills", label: "K / D / A", num: true, render: r => `${r.kills}/${r.deaths}/${r.assists}` },
    { key: "cs", label: "CS", num: true },
    { key: "damage_to_champions", label: "Damage", num: true, render: r => (r.damage_to_champions ?? 0).toLocaleString() },
    { key: "item0", label: "Build", render: buildCell },
    { key: "game_duration_s", label: "Length", num: true, render: r => duration(r.game_duration_s) },
    { key: "source", label: "Src", render: r => `<span class="pill">${esc(r.source)}</span>` },
  ],
  champions: [
    { key: "champion_name", label: "Champion", render: championCell },
    { key: "games", label: "Games", num: true },
    { key: "wins", label: "W", num: true },
    { key: "losses", label: "L", num: true },
    { key: "win_rate", label: "Win rate", num: true, render: r => `${num(r.win_rate, 1)}%` },
    { key: "win_rate", label: "", render: r => wrBar(r.win_rate) },
    { key: "avg_kills", label: "Avg KDA", num: true, render: r => `${num(r.avg_kills,1)}/${num(r.avg_deaths,1)}/${num(r.avg_assists,1)}` },
    { key: "avg_cs", label: "Avg CS", num: true },
    { key: "avg_damage", label: "Avg dmg", num: true, render: r => Number(r.avg_damage || 0).toLocaleString() },
  ],
  augments: [
    { key: "augment_name", label: "Augment" },
    { key: "games", label: "Picked", num: true },
    { key: "wins", label: "W", num: true },
    { key: "losses", label: "L", num: true },
    { key: "win_rate", label: "Win rate", num: true, render: r => `${num(r.win_rate, 1)}%` },
    { key: "win_rate", label: "", render: r => wrBar(r.win_rate) },
    { key: "avg_kills", label: "Avg KDA", num: true, render: r => `${num(r.avg_kills,1)}/${num(r.avg_deaths,1)}/${num(r.avg_assists,1)}` },
  ],
  teammates: [
    { key: "name", label: "Player", render: r =>
        esc(r.name) + (r.tagline ? `<span class="tag">#${esc(r.tagline)}</span>` : "") },
    // Sorted on the numeric ladder position rather than the tier text, which
    // would put Bronze above Diamond. No asterisk on this tab: these are
    // current ranks and nothing here claims otherwise.
    ...LADDERS.map(([q, label]) => ({
      key: q + "_rank", label, render: r =>
        rankSpan({ tier: r[q + "_tier"], division: r[q + "_division"], rank_at_match: 1 })
          || '<span class="muted">—</span>',
    })),
    { key: "games", label: "Games", num: true },
    { key: "wins", label: "W", num: true },
    { key: "losses", label: "L", num: true },
    { key: "win_rate", label: "Win rate", num: true, render: r => `${num(r.win_rate, 1)}%` },
    { key: "win_rate", label: "", render: r => wrBar(r.win_rate) },
    { key: "last_played_ms", label: "Last played", render: r => when(r.last_played_ms) },
  ],
};

function playerLine(p) {
  const tag = p.riot_id_tagline ? `<span class="tag">#${esc(p.riot_id_tagline)}</span>` : "";
  const name = esc(p.riot_id_game_name || p.summoner_name || "?");
  return `<li>${icon("champion", p.champion_id, "champ", p.champion_name)}
    <span class="who">
      <span class="line"><b>${esc(p.champion_name || "?")}</b> — ${name}${tag}
        · ${p.kills}/${p.deaths}/${p.assists}</span>
      ${rankLadders(p)}
    </span>
    ${buildCell(p)}</li>`;
}

function matchDetail(r, key) {
  const side = (id) => (r.team || []).filter(p => p.team_id === id).map(playerLine).join("");
  const augs = (r.augments || []).filter(Boolean);
  const anyApprox = (r.team || []).some(p => (p.ranks || []).some(x => !x.rank_at_match));
  return `<tr class="detail" data-detail="${esc(key)}" hidden><td colspan="12">
    ${augs.length ? `<div class="augs"><b>Augments:</b> ${augs.map(a => `<span class="pill">${esc(a)}</span>`).join(" ")}</div>` : ""}
    <div class="teams" style="margin-top:0.375rem">
      <div><b class="side blue">Team Blue</b><ul>${side(100)}</ul></div>
      <div><b class="side red">Team Red</b><ul>${side(200)}</ul></div>
    </div>
    ${anyApprox ? '<div class="muted" style="margin-top:0.5rem">* current rank — this game predates rank capture, and nothing can say now what someone was ranked at the time.</div>' : ""}
    </td></tr>`;
}

// Flattened so the columns can sort: the table sorts on plain values, and rank,
// win rate and mastery all arrive as nested objects. Missing values sort below
// everyone rather than alongside a genuine zero.
function liveRow(p) {
  const primary = (p.ranks || []).find(r => r.is_game_ladder) || (p.ranks || [])[0];
  return {
    ...p,
    rank_pos: primary ? ladderPosition(primary.tier, primary.division) : -1,
    // Sorted on wins, not rate: only your own row has a rate, so sorting by it
    // would leave the other nine tied.
    wr: p.win_rate ? p.win_rate.wins : -1,
    mastery_points: p.mastery ? p.mastery.points : -1,
    kills: p.scores ? p.scores.kills : -1,
    cs: p.scores ? p.scores.cs : -1,
  };
}

function liveView(snap) {
  if (!snap.live) {
    return `<div class="empty">${esc(snap.reason || "No game in progress.")}</div>`;
  }
  const secs = snap.game_time_s || 0;
  const clock = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`;
  // Several different reasons the Runes column can be sparse, and they mean
  // different things — an unexplained gap reads as broken whichever it is.
  const players = snap.players || [];
  const classic = players.some(p => p.classic_runes);
  let note = "";
  if (!snap.ingame) {
    note = `The game is not answering on its local port, so runes and live scores are
      unavailable. Players, ranks, records and mastery are all current.`;
  } else if (classic) {
    // Classic uses the old marks/seals/glyphs page, which lives on your own
    // account loadout and is published for nobody else.
    note = `This mode uses the old rune and mastery pages. The client only publishes
      yours, so the other nine players' pages cannot be shown.`;
  } else if (players.length && !players.some(p => p.runes)) {
    note = `The game has not reported runes for this match.`;
  }

  const head = `<div class="livehdr">
    <b>${esc(snap.queue_name || snap.game_mode || "Game")}</b>
    ${secs ? `<span class="pill">${clock}</span>` : ""}
    ${snap.is_ranked ? '<span class="pill">Ranked</span>' : ""}
  </div>` + (note ? `<div class="livenote muted">${note}</div>` : "");

  const side = (id, label, cls) => {
    const rows = (snap.players || []).filter(p => p.team_id === id).map(liveRow);
    if (!rows.length) return "";
    return `<div class="liveteam"><b class="side ${cls}">${label}</b>` +
           table(COLS.live, rows) + "</div>";
  };
  return head + side(100, "Team Blue", "blue") + side(200, "Team Red", "red");
}

// Which match rows are open, by game id, so a refresh does not collapse them.
const expanded = new Set();

async function render({ silent = false } = {}) {
  $("#tabs").innerHTML = TABS.map(t =>
    `<button class="tab ${t.id === current ? "on" : ""}" data-tab="${t.id}">${t.label}</button>`).join("");

  const view = $("#view");
  // A background refresh must not blank the table you are reading.
  if (!silent) view.innerHTML = '<div class="empty">Loading…</div>';
  const scrollY = window.scrollY;

  if (current === "live") {
    // Deliberately not through api(): the account and date filters scope stored
    // history, and the game being played belongs to whoever is logged in.
    const snap = await fetch("/api/live").then(r => r.json()).catch(() => null);
    view.innerHTML = snap ? liveView(snap)
                          : '<div class="empty">Could not reach the app.</div>';
  } else if (current === "matches") {
    const rows = await api("matches?limit=300");
    view.innerHTML = table(COLS.matches, rows, {
      detail: matchDetail,
      key: r => String(r.game_id),
      empty: "No matches stored. Run <code>backfill</code> with the client open.",
    });
    view.querySelectorAll("tr.expand").forEach(tr => {
      const key = tr.dataset.key;
      const detail = view.querySelector(`tr[data-detail="${CSS.escape(key)}"]`);
      if (detail && expanded.has(key)) detail.hidden = false;
      tr.onclick = () => {
        if (!detail) return;
        detail.hidden = !detail.hidden;
        if (detail.hidden) expanded.delete(key); else expanded.add(key);
      };
    });
  } else if (current === "augments") {
    const rows = await api("augments");
    view.innerHTML = table(COLS.augments, rows, {
      empty: "No augments recorded yet — play an ARAM: Mayhem game.",
    });
  } else if (current === "teammates") {
    const rows = (await api("teammates?min_games=2")).map(r => ({
      ...r,
      ...Object.fromEntries(LADDERS.map(([q]) =>
        [q + "_rank", ladderPosition(r[q + "_tier"], r[q + "_division"])])),
    }));
    view.innerHTML = table(COLS.teammates, rows, { empty: "Nobody seen twice yet." });
  } else {
    const rows = await api("champions");
    view.innerHTML = table(COLS.champions, rows, { empty: "No champions yet." });
  }

  view.querySelectorAll("th[data-col]").forEach(th => th.onclick = () => {
    const col = th.dataset.col;
    const prev = sortBy[current];
    sortBy[current] = { col, desc: !(prev && prev.col === col && prev.desc) };
    render();
  });

  $("#tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => { current = b.dataset.tab; render(); });

  // Re-rendering resets scroll to the top; put the reader back where they were.
  if (silent && window.scrollY !== scrollY) window.scrollTo(0, scrollY);
}

async function refreshSummary() {
  const { summary, account } = await api("summary");
  if (account) {
    $("#who").textContent = `${account.riot_id_game_name || "LoLcal History"}${account.riot_id_tagline ? "#" + account.riot_id_tagline : ""}`;
    const pfp = $("#pfp");
    // Hidden rather than broken when the icon has not been mirrored yet.
    pfp.hidden = !account.profile_icon_id;
    if (account.profile_icon_id) {
      pfp.onerror = () => { pfp.hidden = true; };
      pfp.src = `/icon/profile/${Number(account.profile_icon_id)}`;
    }
  }
  const games = summary.games || 0, wins = summary.wins || 0;
  const wr = games ? (100 * wins / games).toFixed(1) : "0.0";
  const hours = ((summary.seconds || 0) / 3600).toFixed(1);
  const kda = summary.deaths ? ((summary.kills + summary.assists) / summary.deaths).toFixed(2) : "—";
  $("#cards").innerHTML = [
    ["Games", games], ["Record", `${wins}W ${games - wins}L`], ["Win rate", `${wr}%`],
    ["KDA", kda], ["Time played", `${hours}h`],
  ].map(([k, v]) => `<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
}

function ago(iso) {
  if (!iso) return null;
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  return hrs < 24 ? `${hrs}h ago` : `${Math.floor(hrs / 24)}d ago`;
}

// Shown only when a newer release exists. Nothing about your history is sent to
// check — see lolhist/updates.py — and LOLHIST_NO_UPDATE_CHECK=1 turns it off.
let installing = false;

async function refreshUpdate() {
  const u = await fetch("/api/update").then(r => r.json()).catch(() => null);
  const box = $("#update");

  // Set before any of the early returns below: the version belongs on screen
  // whether or not there is an update to talk about.
  if (u) {
    const state = !u.enabled ? "update check off"
                : u.available ? `${esc(u.latest)} available`
                : "up to date";
    $("#foot").innerHTML = `LoLcal History <b>${esc(u.current)}</b> · ${state}`;
  }

  if (!u || !u.enabled || (!u.available && u.status === "idle")) {
    if (!installing) box.innerHTML = "";
    return;
  }

  const link = `<a href="${esc(u.release?.url || u.releases_url)}" target="_blank" rel="noreferrer">release notes</a>`;

  if (u.status === "downloading" || u.status === "verifying" || u.status === "installing") {
    installing = true;
    const label = { downloading: "Downloading", verifying: "Checking the download",
                    installing: "Installing — the app will reopen by itself" }[u.status];
    box.innerHTML = `<div class="update">
      <div class="grow"><b>${label}…</b> version ${esc(u.latest)}
        <div class="bar"><i style="width:${u.status === "downloading" ? u.progress : 100}%"></i></div>
      </div></div>`;
    return;
  }

  if (u.status === "failed") {
    installing = false;
    box.innerHTML = `<div class="update">
      <div class="grow"><b>The update could not be installed.</b>
        <div class="muted">${esc(u.error || "Unknown error")} — you can download ${esc(u.latest)} from the ${link} instead.</div>
      </div>
      <button id="retry" type="button">Try again</button></div>`;
    $("#retry").onclick = startInstall;
    return;
  }

  // A source checkout has no installer to run, so offer the notes only.
  const action = u.frozen
    ? `<button id="install" type="button">Update now</button>`
    : `<span class="muted">Update with git.</span>`;
  box.innerHTML = `<div class="update">
    <div class="grow"><b>Version ${esc(u.latest)} is available.</b>
      <span class="muted">You have ${esc(u.current)} — ${link}.</span></div>
    ${action}</div>`;
  const button = $("#install");
  if (button) button.onclick = startInstall;
}

async function startInstall() {
  installing = true;
  const button = $("#install") || $("#retry");
  if (button) { button.disabled = true; button.textContent = "Starting…"; }
  await fetch("/api/update/install", { method: "POST" }).catch(() => {});
  await refreshUpdate();
  // Follow the download closely while it runs, rather than at the page's pace.
  const poll = setInterval(async () => {
    await refreshUpdate();
    if (!installing) clearInterval(poll);
  }, 1000);
}

// A watcher that fails silently is worse than one that crashes, so its state
// gets its own banner rather than living only in the log.
async function refreshHealth() {
  const h = await fetch("/api/health").then(r => r.json()).catch(() => null);
  if (!h) return;

  if (h.degraded) {
    const err = h.last_error || {};
    $("#alert").innerHTML = `<div class="alert">
      <h3>Games are not being recorded</h3>
      <p>${h.consecutive_failures} capture${h.consecutive_failures === 1 ? "" : "s"} failed in a row.
         Anything you play now is missing from this page.</p>
      <p><b>${esc(err.kind || "Error")}:</b> ${esc(err.message || "unknown")}</p>
      <p>Restart the watcher, then run <code>lolhist doctor</code>.</p>
    </div>`;
  } else {
    $("#alert").innerHTML = "";
  }

  const seen = ago(h.last_seen_at), caught = ago(h.last_capture_at);
  $("#watcher").textContent = h.captures_ok || h.captures_failed || seen
    ? `Watcher: ${h.captures_ok} captured, ${h.captures_failed} failed` +
      (caught ? ` · last catch ${caught}` : " · nothing captured yet") +
      (seen ? ` · last seen ${seen}` : "")
    : "Watcher has not run yet — matches here come from history backfill.";
}

// Only shown once a second account has been seen, so the ordinary single-account
// window looks exactly as it did before.
async function refreshAccounts() {
  const { accounts, selected } = await fetch("/api/accounts").then(r => r.json());
  const sel = $("#f-account");

  sel.hidden = accounts.length < 2;
  if (sel.hidden) {
    accountChoice = null;
    sel.innerHTML = "";
    return;
  }

  sel.innerHTML = accounts.map(a => {
    const tag = a.riot_id_tagline ? `#${a.riot_id_tagline}` : "";
    const name = a.riot_id_game_name || "Account";
    return `<option value="${esc(a.puuid)}">${esc(name + tag)} (${a.games})</option>`;
  }).join("");
  // Falls back to the server's choice while nothing has been picked here.
  sel.value = accountChoice || selected || "";
}

// Rebuilt on refresh so a newly played champion or mode appears in the filters,
// while keeping whatever you had selected.
async function refreshFilters() {
  const f = await api("filters");
  const queue = $("#f-queue"), champ = $("#f-champ");
  const keepQueue = queue.value, keepChamp = champ.value;

  queue.innerHTML = '<option value="">All modes</option>' +
    f.queues.map(q => `<option value="${q.queue_id}">${esc(q.queue_name)} (${q.games})</option>`).join("");
  // League Classic ships its own champion ids, offset by 60000 — so the same
  // name legitimately appears twice. Labelling them stops that reading as a bug.
  champ.innerHTML = '<option value="">All champions</option>' +
    f.champions.map(c => {
      const suffix = c.champion_id >= 60000 ? " [Classic]" : "";
      return `<option value="${c.champion_id}">${esc(c.champion_name)}${suffix} (${c.games})</option>`;
    }).join("");

  queue.value = keepQueue;
  champ.value = keepChamp;
}

const REFRESH_MS = 30000;
// A game moves faster than the page's ordinary half-minute pace, and the live
// snapshot is cheap — the expensive half (names, ranks, mastery) is built once
// per game on the server and reused, so a poll is one request to the game.
const LIVE_REFRESH_MS = 3000;
let lastRefresh = null;
let refreshing = false;
let livePolling = false;

function paintUpdated() {
  if (!lastRefresh) return;
  const secs = Math.round((Date.now() - lastRefresh) / 1000);
  $("#updated").textContent =
    secs < 5 ? "updated just now" : secs < 60 ? `updated ${secs}s ago`
    : `updated ${Math.floor(secs / 60)}m ago`;
}

async function refreshAll({ silent = true } = {}) {
  if (refreshing) return;          // never stack a manual click onto the timer
  refreshing = true;
  const button = $("#refresh");
  button.classList.add("busy");
  button.disabled = true;
  try {
    await refreshAccounts();   // before the rest: it decides what they are scoped to
    await Promise.all([refreshFilters(), refreshSummary(), refreshHealth(), refreshUpdate()]);
    await render({ silent });
    lastRefresh = Date.now();
    paintUpdated();
  } catch (err) {
    // The window has no address bar to reload from, so a failed refresh has to
    // say so rather than just leaving stale numbers on screen.
    $("#updated").textContent = "refresh failed — is the app still running?";
    console.error(err);
  } finally {
    refreshing = false;
    button.classList.remove("busy");
    button.disabled = false;
  }
}

// Only the live tab, and only while it is the one being looked at. Guarded
// against both the ordinary refresh and its own previous tick, so a slow
// snapshot cannot stack requests on top of each other.
async function pollLive() {
  if (current !== "live" || document.hidden || refreshing || livePolling) return;
  livePolling = true;
  try {
    await render({ silent: true });
  } catch (err) {
    console.error(err);
  } finally {
    livePolling = false;
  }
}

async function boot() {
  // Tooltip text for the build icons. Failing is survivable — the icons still
  // render, they just stop naming themselves on hover.
  // Merged rather than replaced, so every map the page reads from still exists
  // if an older cache is missing one of them.
  assetNames = await fetch("/api/assets").then(r => r.json())
    .then(names => ({ ...assetNames, ...names })).catch(() => assetNames);

  await refreshAccounts();
  await refreshFilters();

  ["#f-queue", "#f-champ", "#f-days"].forEach(sel =>
    $(sel).onchange = () => { refreshSummary(); render(); });

  $("#f-account").onchange = () => {
    accountChoice = $("#f-account").value || null;
    // Open rows belong to the account that was on screen a moment ago.
    expanded.clear();
    refreshAll({ silent: false });
  };

  paintThemeButton();
  $("#theme").onclick = () => setTheme(themeNow() === "light" ? "dark" : "light");

  // Keep following the system until the button is used — after that the choice
  // stands, and Windows switching to night mode no longer overrides it.
  window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", (e) => {
    if (!savedTheme()) setTheme(e.matches ? "light" : "dark", { remember: false });
  });

  $("#refresh").onclick = () => refreshAll({ silent: false });
  document.addEventListener("keydown", (e) => {
    if (e.key === "F5" || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "r")) {
      e.preventDefault();
      refreshAll({ silent: false });
    }
  });

  await refreshSummary();
  await refreshHealth();
  await refreshUpdate();
  await render();
  lastRefresh = Date.now();
  paintUpdated();

  // Skipped while the window is hidden in the tray — there is nobody to show it
  // to, and it would keep waking the database for no reason.
  setInterval(() => { if (!document.hidden) refreshAll(); }, REFRESH_MS);
  setInterval(pollLive, LIVE_REFRESH_MS);
  setInterval(paintUpdated, 5000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) refreshAll();
  });
}
boot();
</script>
</body>
</html>
