name: Release

# Push a tag, get a release:
#
#   1. bump __version__ in lolhist/version.py (and version in pyproject.toml)
#   2. git commit && git push
#   3. git tag v1.2.3 && git push origin v1.2.3
#
# The tag must match version.py. The app compares its own version against the
# latest release tag to decide whether an update exists, so a mismatch would
# either nag forever or never offer anything — the build fails instead.
on:
  push:
    tags: ["v*"]
  # For rehearsing the build without publishing anything.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no leading v). Does not publish."
        required: true
        default: "0.0.0-test"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,desktop,build]"

      - name: Run tests
        run: python -m pytest -q

      - name: Resolve and verify the version
        id: version
        shell: pwsh
        run: |
          $declared = python -c "from lolhist.version import __version__; print(__version__)"
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
            $fromTag = $tag -replace '^v', ''
            if ($fromTag -ne $declared) {
              Write-Host "::error::Tag $tag does not match lolhist/version.py ($declared)."
              Write-Host "::error::Set __version__ = `"$fromTag`" (and pyproject version), commit, then re-tag."
              exit 1
            }
            $version = $declared
            "publish=true" >> $env:GITHUB_OUTPUT
          } else {
            $version = "${{ github.event.inputs.version }}"
            "publish=false" >> $env:GITHUB_OUTPUT
          }
          "version=$version" >> $env:GITHUB_OUTPUT

          # Windows' version resource accepts digits and dots only, so a label
          # like "0.2.0-rc1" has to be stripped for it. Inno aborts otherwise.
          $numeric = [regex]::Match($version, '^\d+(\.\d+){0,3}').Value
          if (-not $numeric) { $numeric = "0.0.0" }
          "numeric=$numeric" >> $env:GITHUB_OUTPUT

          Write-Host "Building $version (file version $numeric)"

      - name: Build the executable
        run: python -m PyInstaller lolhist.spec --noconfirm --clean

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          # Machine-wide (choco) and per-user (winget) installs land in
          # different places, so look rather than assume.
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found. Looked in:`n" + ($candidates -join "`n") }
          Write-Host "Using $iscc"

          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" `
                  "/DNumericVersion=${{ steps.version.outputs.numeric }}" `
                  "installer\lolcal-history.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }

      - name: Stage the release assets
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force release | Out-Null

          Copy-Item "dist\installer\LoLcal-History-$v-Setup.exe" "release\"
          # The portable build too, for anyone who would rather not install.
          Copy-Item "dist\LoLcal History.exe" "release\LoLcal-History-$v-portable.exe"

          # Names only, no directory prefix — the updater matches on the asset
          # name exactly as it appears in the release.
          Push-Location release
          Get-FileHash -Algorithm SHA256 *.exe |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LoLcal-History-${{ steps.version.outputs.version }}
          path: release/*
          retention-days: 14

      # Kept in .github/release-notes.md rather than inline: prose indented
      # inside a YAML block scalar is one stray column away from breaking the
      # whole workflow, and a release note is easier to edit as a file.
      - name: Write the release notes
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          (Get-Content .github/release-notes.md -Raw) `
            -replace '\{\{VERSION\}\}', "${{ steps.version.outputs.version }}" |
            Set-Content -Path release-notes.md -Encoding utf8

      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: LoLcal History ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          append_body: true
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
